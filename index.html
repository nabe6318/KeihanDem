<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>畦畔検出マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; color: #222; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: #4a5d23; color: #fff; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #status { font-size: 12px; opacity: .95; }
  #main { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; }
  #panel { width: 390px; overflow-y: auto; border-left: 1px solid #ddd; padding: 12px 14px; background: #fafafa; font-size: 14px; }
  .muted { color: #888; } .small { font-size: 12px; } .warn { color: #c62828; } .ok { color: #2e7d32; }
  a.act { color: #4a5d23; cursor: pointer; text-decoration: underline; }
  .box { background: #fff; border: 1px solid #e3e3e3; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
  .box h3 { font-size: 13px; margin: 0 0 6px; color: #4a5d23; display: flex; justify-content: space-between; align-items: center; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 110px; padding: 7px; font-size: 13px; border: 1px solid #4a5d23; border-radius: 6px; background: #fff; color: #4a5d23; cursor: pointer; }
  .btns button.main { background: #4a5d23; color: #fff; }
  .btns button:disabled { opacity: .45; cursor: default; }
  .grid2 { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; align-items: center; font-size: 13px; }
  .grid2 input[type=number], .grid2 select, .grid2 input[type=text] { width: 100%; padding: 3px 5px; font-size: 13px; }
  .grid2 input.n { width: 72px; }
  .grid2 input[type=checkbox] { vertical-align: -2px; }
  .grid2 label { display: block; }
  .legend { background: #fff; padding: 6px 9px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.3); font-size: 12px; line-height: 1.7; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -1px; border: 1px solid #555; }
  .prog { height: 6px; background: #eee; border-radius: 3px; overflow: hidden; margin-top: 6px; display: none; }
  .prog span { display: block; height: 100%; width: 0; background: #7cb342; transition: width .2s; }
  table.sum { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.sum td { padding: 2px 4px; border-bottom: 1px solid #eee; }
  table.sum td.r { text-align: right; font-variant-numeric: tabular-nums; }
  ul.files { margin: 4px 0 0; padding-left: 18px; font-size: 12px; max-height: 110px; overflow-y: auto; }
  .drop { outline: 3px dashed #7cb342; outline-offset: -8px; }
  @media (max-width: 760px) {
    #main { flex-direction: column; }
    #panel { width: 100%; height: 50%; border-left: 0; border-top: 1px solid #ddd; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>畦畔検出マップ</h1>
    <span id="status">DEM(GeoTIFF)と筆ポリゴンを読み込んでください</span>
  </header>
  <div id="main">
    <div id="map"></div>
    <aside id="panel"></aside>
  </div>
</div>
<input type="file" id="inDem" accept=".tif,.tiff" multiple style="display:none">
<input type="file" id="inFude" accept=".geojson,.json,.gpkg" multiple style="display:none">

<script>
// ===================== 設定(ここだけ編集すればOK) =====================
const CONFIG = {
  view: { center: [35.84, 137.96], zoom: 13 },   // 起動時の地図の中心(伊那谷)
  defaults: {
    buffer: 0.5,       // 筆ポリゴンのバッファ(m)。隣り合う筆の隙間(畦)を埋めて農地ブロックにする
    close: false,      // バッファ後に同じ幅だけ内側に戻す(外周は広げず、筆の間の隙間だけ埋める)
    slope: 15,         // この傾斜(度)以上を畦畔(法面)とする
    relief: 10,        // 細い高まり(トップハット)がこの高さ(cm)以上を畦畔(畦)とする
    reliefWin: 5,      // この幅(m)より細い高まりを畦とみなす。畦の幅より広く、田面の幅より狭く
    minAza: 5,         // これより小さい畦畔のかたまり(m²)は田面に戻す(ノイズ除去)
    minFlat: 15,       // これより小さい平坦部(m²)は畦畔に含める(法面の小段など)
    edgeDist: 5,       // 筆の境界からこの距離(m)より内側の畦畔は田面に戻す(0=制限なし)。法面が広い棚田では広めに
    smooth: 1,         // 畦畔の輪郭をならす回数(3×3の多数決)。小さな突起・ギザギザを除く(0=しない)
    csOpacity: 0.85, clsOpacity: 0.75,
    showCs: true, showCls: true, showFude: true,
  },
  maxCells: 25e6,      // 一度に計算するセル数の上限(1mなら 25 km²)。超えたら地図を拡大して範囲を絞る
  sqlWasm: 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.wasm',
};
// ======================================================================

const map = L.map('map', { maxZoom: 21, preferCanvas: true }).setView(CONFIG.view.center, CONFIG.view.zoom);
const gsi = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
const bases = {
  '地理院 航空写真': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  '地理院 淡色地図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 18, maxZoom: 21 }),
  '地理院 陰影起伏図': L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/hillshademap/{z}/{x}/{y}.png', { attribution: gsi, maxNativeZoom: 16, maxZoom: 21 }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors', maxNativeZoom: 19, maxZoom: 21 }),
};
bases['地理院 航空写真'].addTo(map);
L.control.scale({ imperial: false }).addTo(map);

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 0) => Number(v).toLocaleString('ja-JP', { minimumFractionDigits: d, maximumFractionDigits: d });
const setStatus = t => document.getElementById('status').textContent = t;
const tick = () => new Promise(r => setTimeout(r, 0));
const store = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
                set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} } };
const P = Object.assign({}, CONFIG.defaults);
try { Object.assign(P, JSON.parse(store.get('aze-params') || '{}')); } catch {}
const saveP = () => store.set('aze-params', JSON.stringify(P));
function progress(f) { const b = document.getElementById('prog'); if (!b) return;
  b.style.display = f == null ? 'none' : 'block'; b.firstElementChild.style.width = `${Math.round((f || 0) * 100)}%`; }

// ===================== 座標系 =====================
const CRS = {};
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX'];
[[33, 129.5], [33, 131], [36, 132 + 1 / 6], [33, 133.5], [36, 134 + 1 / 3], [36, 136], [36, 137 + 1 / 6], [36, 138.5], [36, 139 + 5 / 6],
 [40, 140 + 5 / 6], [44, 140.25], [44, 142.25], [44, 144.25], [26, 142], [26, 127.5], [26, 124], [26, 131], [20, 136], [26, 154]]
  .forEach(([lat, lon], i) => {
    const def = `+proj=tmerc +lat_0=${lat} +lon_0=${lon} +k=0.9999 +x_0=0 +y_0=0 +ellps=GRS80 +units=m +no_defs`;
    CRS[6669 + i] = { def, label: `JGD2011 平面直角 ${ROMAN[i]}系` };
    CRS[2443 + i] = { def, label: `JGD2000 平面直角 ${ROMAN[i]}系` };
  });
for (let z = 51; z <= 55; z++) {
  CRS[6688 + z - 51] = { def: `+proj=utm +zone=${z} +ellps=GRS80 +units=m +no_defs`, label: `JGD2011 UTM ${z}N` };
  CRS[3097 + z - 51] = { def: `+proj=utm +zone=${z} +ellps=GRS80 +units=m +no_defs`, label: `JGD2000 UTM ${z}N` };
  CRS[32600 + z] = { def: `+proj=utm +zone=${z} +datum=WGS84 +units=m +no_defs`, label: `WGS84 UTM ${z}N` };
}
[[4326, 'WGS84 緯度経度'], [6668, 'JGD2011 緯度経度'], [4612, 'JGD2000 緯度経度']].forEach(([e, l]) => CRS[e] = { def: '+proj=longlat +ellps=GRS80 +no_defs', label: l, geo: true });
CRS[3857] = { def: 'EPSG:3857', label: 'Webメルカトル' };
const IDT = { forward: c => [c[0], c[1]], inverse: c => [c[0], c[1]] };
const trOf = epsg => CRS[epsg].geo ? IDT : proj4('EPSG:4326', CRS[epsg].def);
function askCrs(name, hint) {
  const v = (prompt(`「${name}」の座標系を判定できませんでした${hint ? `(コード ${hint})` : ''}。\nEPSGコード(例 6676)、または平面直角座標の系番号(1〜19、長野県は 8)を入力してください`) || '').trim();
  if (!v) return 0;
  const n = parseInt(v, 10), e = n >= 1 && n <= 19 ? 6668 + n : n;
  if (!CRS[e]) { alert(`EPSG:${e} には対応していません`); return 0; }
  return e;
}
const crsName = e => `${CRS[e].label}(EPSG:${e})`;

// ===================== GPKG / GeoJSON の読み込み =====================
let sqlP = null;
const sqlLib = () => sqlP ||= initSqlJs({ locateFile: () => CONFIG.sqlWasm });
function readWkb(dv, o) {
  const le = dv.getUint8(o) === 1; o += 1;
  let t = dv.getUint32(o, le); o += 4;
  let dim = 2;
  if (t & 0x80000000) dim++; if (t & 0x40000000) dim++;
  t &= 0x0fffffff;
  if (t > 1000) { const k = Math.floor(t / 1000); dim = k === 3 ? 4 : 3; t %= 1000; }
  const pt = () => { const x = dv.getFloat64(o, le), y = dv.getFloat64(o + 8, le); o += 8 * dim; return [x, y]; };
  const n = () => { const v = dv.getUint32(o, le); o += 4; return v; };
  const line = () => { const k = n(), a = []; for (let i = 0; i < k; i++) a.push(pt()); return a; };
  const poly = () => { const k = n(), a = []; for (let i = 0; i < k; i++) a.push(line()); return a; };
  const multi = () => { const k = n(), a = []; for (let i = 0; i < k; i++) { const r = readWkb(dv, o); o = r.o; a.push(r.g); } return a; };
  let g;
  if (t === 1) g = { type: 'Point', coordinates: pt() };
  else if (t === 2) g = { type: 'LineString', coordinates: line() };
  else if (t === 3) g = { type: 'Polygon', coordinates: poly() };
  else if (t === 4) g = { type: 'MultiPoint', coordinates: multi().map(x => x.coordinates) };
  else if (t === 5) g = { type: 'MultiLineString', coordinates: multi().map(x => x.coordinates) };
  else if (t === 6) g = { type: 'MultiPolygon', coordinates: multi().map(x => x.coordinates) };
  else if (t === 7) g = { type: 'GeometryCollection', geometries: multi() };
  else throw new Error('未対応のジオメトリ型 ' + t);
  return { g, o };
}
function gpkgGeom(blob) {
  if (!blob || blob.length < 8 || blob[0] !== 0x47 || blob[1] !== 0x50) return null;
  const flags = blob[3];
  if (flags & 0x10) return null;
  const env = [0, 32, 48, 48, 64][(flags >> 1) & 7] || 0;
  const dv = new DataView(blob.buffer, blob.byteOffset, blob.byteLength);
  return readWkb(dv, 8 + env).g;
}
function mapCoords(g, f) {
  const m = c => typeof c[0] === 'number' ? f(c) : c.map(m);
  return g.type === 'GeometryCollection' ? { ...g, geometries: g.geometries.map(x => mapCoords(x, f)) } : { ...g, coordinates: m(g.coordinates) };
}
function toLonLat(epsg, wkt, name) {
  if (CRS[epsg]) return CRS[epsg].geo ? null : c => trOf(epsg).inverse(c);
  if (wkt) try { const p = proj4(wkt, 'EPSG:4326'); return c => p.forward(c); } catch {}
  const e = askCrs(name, epsg); if (!e) throw new Error('座標系が指定されませんでした');
  return CRS[e].geo ? null : c => trOf(e).inverse(c);
}
async function readGpkg(buf, name) {
  const SQL = await sqlLib();
  const db = new SQL.Database(new Uint8Array(buf));
  const q = (s, p) => { const st = db.prepare(s); if (p) st.bind(p); const out = []; while (st.step()) out.push(st.getAsObject()); st.free(); return out; };
  try {
    const tables = q(`SELECT c.table_name AS t, g.column_name AS col, g.srs_id AS srs FROM gpkg_contents c
                      JOIN gpkg_geometry_columns g ON g.table_name = c.table_name WHERE c.data_type = 'features'`);
    if (!tables.length) throw new Error('ポリゴンなどの地物レイヤがありません');
    return tables.flatMap(({ t, col, srs }) => {
      const s = q('SELECT organization AS org, organization_coordsys_id AS id, definition AS def FROM gpkg_spatial_ref_sys WHERE srs_id = ?', [srs])[0] || {};
      const epsg = String(s.org || '').toUpperCase() === 'EPSG' ? s.id : srs;
      const f = srs === 0 ? null : toLonLat(epsg, s.def && s.def !== 'undefined' ? s.def : '', `${name} / ${t}`);
      const feats = [];
      q(`SELECT * FROM "${t.replace(/"/g, '""')}"`).forEach(r => {
        const g = gpkgGeom(r[col]); delete r[col];
        if (!g) return;
        Object.keys(r).forEach(k => { if (r[k] instanceof Uint8Array) delete r[k]; });
        feats.push({ type: 'Feature', properties: r, geometry: f ? mapCoords(g, f) : g });
      });
      return feats;
    });
  } finally { db.close(); }
}
function readGeoJSON(text, name) {
  const g = JSON.parse(text);
  const feats = g.type === 'FeatureCollection' ? g.features : [g.type === 'Feature' ? g : { type: 'Feature', properties: {}, geometry: g }];
  const m = String(g.crs?.properties?.name || '').match(/EPSG:{1,2}(\d+)/i);
  const f = toLonLat(m ? +m[1] : 4326, '', name);
  if (f) feats.forEach(x => { if (x.geometry) x.geometry = mapCoords(x.geometry, f); });
  return feats;
}

// ===================== DEM(ローカルのGeoTIFF、複数タイル可) =====================
let TILES = [], DEMI = null;   // DEMI: { epsg, tr, dx, dy }
const demFrames = L.layerGroup().addTo(map);
async function addDemFiles(files) {
  for (const f of files) {
    try {
      setStatus(`DEMを読み込み中…${f.name}`);
      const tiff = await GeoTIFF.fromBlob(f), img = await tiff.getImage();
      const gk = img.getGeoKeys() || {};
      let epsg = gk.ProjectedCSTypeGeoKey || (gk.GTModelTypeGeoKey === 2 ? (gk.GeographicTypeGeoKey || 4326) : 0);
      if (!CRS[epsg]) {
        if (DEMI && confirm(`「${f.name}」の座標系が判定できません。先に読み込んだDEMと同じ ${crsName(DEMI.epsg)} とみなしますか?`)) epsg = DEMI.epsg;
        else { epsg = askCrs(f.name, epsg); if (!epsg) continue; }
      }
      if (CRS[epsg].geo) throw new Error('緯度経度のDEMには対応していません。QGISで平面直角座標(長野県は VIII系 EPSG:6676)に変換してください');
      const [ox, oy] = img.getOrigin(), [rx, ry] = img.getResolution();
      const T = { name: f.name, tiff, img, epsg, ox, oy, dx: rx, dy: Math.abs(ry), W: img.getWidth(), H: img.getHeight(), nodata: img.getGDALNoData() };
      if (!DEMI) DEMI = { epsg, tr: trOf(epsg), dx: T.dx, dy: T.dy };
      else if (epsg !== DEMI.epsg) throw new Error(`座標系が違います(${crsName(epsg)})。先に読み込んだDEMは ${crsName(DEMI.epsg)}`);
      else if (Math.abs(T.dx - DEMI.dx) > 1e-3 || Math.abs(T.dy - DEMI.dy) > 1e-3) throw new Error(`解像度が違います(${T.dx} m)。先に読み込んだDEMは ${DEMI.dx} m`);
      TILES = TILES.filter(t => t.name !== f.name); TILES.push(T);
      const ring = [[ox, oy], [ox + T.W * T.dx, oy], [ox + T.W * T.dx, oy - T.H * T.dy], [ox, oy - T.H * T.dy]].map(c => DEMI.tr.inverse(c)).map(([x, y]) => [y, x]);
      demFrames.addLayer(L.polygon(ring, { color: '#ffeb3b', weight: 1.5, dashArray: '5 5', fill: false, interactive: false }));
    } catch (e) { alert(`「${f.name}」を読み込めませんでした:${e.message}`); }
  }
  setStatus(TILES.length ? `DEM ${TILES.length} 枚` : '');
  if (TILES.length && !FUDE.length) map.fitBounds(L.featureGroup(demFrames.getLayers()).getBounds());
  render();
}
// 計算範囲(グリッド)の窓 [x0,y0,w,h] の標高を、重なるタイルから読み込む(なし=NaN)
async function readArea(x0, y0, w, h) {
  const out = new Float32Array(w * h).fill(NaN);
  for (const T of TILES) {
    const tc = Math.round((T.ox - A.ox) / A.dx), tr = Math.round((A.oy - T.oy) / A.dy);
    const ix0 = Math.max(x0, tc), iy0 = Math.max(y0, tr), ix1 = Math.min(x0 + w, tc + T.W), iy1 = Math.min(y0 + h, tr + T.H);
    if (ix0 >= ix1 || iy0 >= iy1) continue;
    const [band] = await T.img.readRasters({ window: [ix0 - tc, iy0 - tr, ix1 - tc, iy1 - tr], samples: [0] });
    const bw = ix1 - ix0;
    for (let r = iy0; r < iy1; r++) for (let c = ix0; c < ix1; c++) {
      const k = (r - y0) * w + (c - x0); if (out[k] === out[k]) continue;
      const v = band[(r - iy0) * bw + (c - ix0)];
      if (v !== T.nodata && Number.isFinite(v) && v > -1000) out[k] = v;
    }
  }
  return out;
}

// ===================== 筆ポリゴン =====================
let FUDE = [], FUDE_KEYS = [];
const fudeLayer = L.geoJSON(null, { style: () => ({ color: '#ffee58', weight: 1, fill: true, fillOpacity: 0, opacity: 0.9 }),
  onEachFeature: (f, l) => l.on('click', e => { L.DomEvent.stopPropagation(e); showFude(f, e.latlng); }) });
async function addFudeFiles(files) {
  for (const f of files) {
    try {
      setStatus(`筆ポリゴンを読み込み中…${f.name}`);
      const feats = /\.gpkg$/i.test(f.name) ? await readGpkg(await f.arrayBuffer(), f.name) : readGeoJSON(await f.text(), f.name);
      const polys = feats.filter(x => x.geometry && /Polygon/.test(x.geometry.type));
      polys.forEach(x => { x._src = f.name; FUDE.push(x); });
    } catch (e) { alert(`「${f.name}」を読み込めませんでした:${e.message}`); }
  }
  const keys = new Set(); FUDE.slice(0, 200).forEach(x => Object.keys(x.properties || {}).forEach(k => keys.add(k)));
  FUDE_KEYS = [...keys];
  if (!P.idField || !FUDE_KEYS.includes(P.idField)) P.idField = ['polygon_uuid', 'field_id', 'fude_id', 'id', 'ID'].find(k => FUDE_KEYS.includes(k)) || '';
  if (P.filterField && !FUDE_KEYS.includes(P.filterField)) P.filterField = '';
  // 農水省の筆ポリゴン(land_type:100=田、200=畑)で田があれば、田だけを対象にする
  if (!P.filterField && FUDE.some(x => String(x.properties?.land_type) === '100')) { P.filterField = 'land_type'; P.filterValue = '100'; }
  saveP();
  fudeLayer.clearLayers(); fudeLayer.addData({ type: 'FeatureCollection', features: FUDE });
  if (P.showFude) fudeLayer.addTo(map);
  if (FUDE.length) map.fitBounds(fudeLayer.getBounds());
  setStatus(`筆ポリゴン ${nf(FUDE.length)} 筆`);
  render();
}
const fudeId = (f, i) => P.idField ? f.properties[P.idField] : i + 1;
const fudeSelected = f => !P.filterField || P.filterValue === '' || String(f.properties[P.filterField] ?? '') === String(P.filterValue);

// ===================== 計算 =====================
// A: 計算範囲 { ox, oy(左上の角), dx, dy, w, h, N, fid, slp, rel, cls, cs… }
let A = null, RES = null;
function boxBlur(src, w, h, sigma) {   // ボックスぼかし3回でガウシアンを近似
  const n = 3, wIdeal = Math.sqrt(12 * sigma * sigma / n + 1);
  let wl = Math.floor(wIdeal); if (wl % 2 === 0) wl--;
  const m = Math.round((12 * sigma * sigma - n * wl * wl - 4 * n * wl - 3 * n) / (-4 * wl - 4));

  csLayer.redraw(); clsLayer.redraw(); render();
}

async function run() {
  try {
    document.getElementById('runBtn').disabled = true;
    setStatus('範囲を準備中…'); progress(0); await tick();
    const plan = planArea();
    FUDE.forEach(f => delete f._res);
    A = plan; RES = null;
    setStatus(`筆ポリゴンを焼き込み中…(${nf(A.sel.length)} 筆・${nf(A.w)}×${nf(A.h)} セル)`); await tick();
    rasterFude();
    areaFrame.setLatLngs([[A.ox, A.oy], [A.ox + A.w * A.dx, A.oy], [A.ox + A.w * A.dx, A.oy - A.h * A.dy], [A.ox, A.oy - A.h * A.dy]].map(c => DEMI.tr.inverse(c)).map(([x, y]) => [y, x]));
    await computeFeatures();
    classify();
    const t = RES.reduce((a, r) => (a[0] += r.aze, a[1] += r.block, a), [0, 0]);
    setStatus(`完了:${nf(A.sel.length)} 筆、畦畔 ${nf(t[0] / 1e4, 2)} ha(農地ブロックの ${(t[0] / t[1] * 100).toFixed(1)}%)`);
  } catch (e) { console.error(e); alert(e.message); setStatus(''); }
  finally { progress(null); const b = document.getElementById('runBtn'); if (b) b.disabled = false; render(); }
}

const gridLayer = draw => L.GridLayer.extend({
  createTile(coords) {
    const tile = document.createElement('canvas'), sz = this.getTileSize();
    tile.width = sz.x; tile.height = sz.y;
    if (!A || !A.slp) return tile;
    const crs = this._map.options.crs, z = coords.z;
    const corner = (px, py) => { const ll = crs.pointToLatLng(L.point(coords.x * sz.x + px, coords.y * sz.y + py), z);
      const [x, y] = DEMI.tr.forward([ll.lng, ll.lat]); return [(x - A.ox) / A.dx, (A.oy - y) / A.dy]; };
    const a = corner(0, 0), b = corner(sz.x, 0), c = corner(0, sz.y), d = corner(sz.x, sz.y);
    if (Math.max(a[0], b[0], c[0], d[0]) < 0 || Math.max(a[1], b[1], c[1], d[1]) < 0 || Math.min(a[0], b[0], c[0], d[0]) > A.w || Math.min(a[1], b[1], c[1], d[1]) > A.h) return tile;
    const ctx = tile.getContext('2d'), im = ctx.createImageData(sz.x, sz.y), px = new Uint32Array(im.data.buffer);
    for (let j = 0; j < sz.y; j++) {
      const v = (j + 0.5) / sz.y;
      const lx = a[0] + (c[0] - a[0]) * v, ly = a[1] + (c[1] - a[1]) * v, rxx = b[0] + (d[0] - b[0]) * v, ryy = b[1] + (d[1] - b[1]) * v;
      for (let i = 0; i < sz.x; i++) {
        const u = (i + 0.5) / sz.x, gx = Math.floor(lx + (rxx - lx) * u), gy = Math.floor(ly + (ryy - ly) * u);
        if (gx < 0 || gy < 0 || gx >= A.w || gy >= A.h) continue;
        const col = draw(gx, gy); if (col) px[j * sz.x + i] = col;
      }
    }
    ctx.putImageData(im, 0, 0);
    return tile;
  },
});

function exportCsv() {
  const q = v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = [P.idField || '番号', '筆面積_m2', 'ブロック受持_m2', '田面_m2', '畦畔_m2', '畦畔表面積_m2', '畦畔率_%', 'DEMなし_m2'];
  if (P.filterField) head.splice(1, 0, P.filterField);
  const rows = RES.map(r => { const a = [r.id, r1(r.polyArea), r1(r.block), r1(r.flat), r1(r.aze), r1(r.azeSurf), r.block ? r1(r.aze / r.block * 100) : 0, r1(r.nodem)];
    if (P.filterField) a.splice(1, 0, r.f.properties[P.filterField]); return a; });
  save(`畦畔集計_${today()}.csv`, '﻿' + [`# ${condText()}`, head.join(','), ...rows.map(r => r.map(q).join(','))].join('\r\n'), 'text/csv');
}
function exportFudeGeojson() {

    筆面積_m2: r1(r.polyArea), 田面_m2: r1(r.flat), 畦畔_m2: r1(r.aze), 畦畔表面積_m2: r1(r.azeSurf), 畦畔率_pct: r.block ? r1(r.aze / r.block * 100) : 0 } }));

// 畦畔を筆ごとにポリゴン化(d3-contour)。座標は緯度経度
async function exportAzeGeojson() {
  setStatus('畦畔をポリゴンにしています…'); await tick();
  const { w, fid, cls, fbox } = A, features = [];
  for (let k = 0; k < A.sel.length; k++) {
    const c0 = fbox[k * 4], r0 = fbox[k * 4 + 1], c1 = fbox[k * 4 + 2], r1_ = fbox[k * 4 + 3];
    if (c1 < 0 || !RES[k].aze) continue;
    const bw = c1 - c0 + 3, bh = r1_ - r0 + 3, v = new Float64Array(bw * bh);
    for (let r = r0; r <= r1_; r++) for (let c = c0; c <= c1; c++) { const i = r * w + c; if (fid[i] === k && cls[i] === 2) v[(r - r0 + 1) * bw + (c - c0 + 1)] = 1; }
    const [mp] = d3.contours().size([bw, bh]).thresholds([0.5])(v);
    if (!mp.coordinates.length) continue;
    const coords = mp.coordinates.map(poly => poly.map(ring => ring.map(([u, t]) => {
      const x = A.ox + (u - 1 + c0) * A.dx, y = A.oy - (t - 1 + r0) * A.dy, [lng, lat] = DEMI.tr.inverse([x, y]);
      return [+lng.toFixed(8), +lat.toFixed(8)]; })));
    features.push({ type: 'Feature', geometry: { type: 'MultiPolygon', coordinates: coords },
      properties: { 筆ID: RES[k].id, 畦畔_m2: r1(RES[k].aze), 畦畔表面積_m2: r1(RES[k].azeSurf) } });
    if (k % 300 === 0) await tick();
  }
  save(`畦畔ポリゴン_${today()}.geojson`, JSON.stringify({ type: 'FeatureCollection', 条件: condText(), features }), 'application/geo+json');
  setStatus(`畦畔ポリゴン ${nf(features.length)} 筆分を書き出しました`);
}

  const vis = (id, layer, key) => on(id, 'onchange', e => { P[key] = e.target.checked; saveP(); P[key] ? layer.addTo(map) : layer.remove(); });
  vis('vCs', csLayer, 'showCs'); vis('vCls', clsLayer, 'showCls'); vis('vFude', fudeLayer, 'showFude');
  on('oCs', 'oninput', e => { P.csOpacity = +e.target.value; csLayer.setOpacity(P.csOpacity); }); on('oCs', 'onchange', saveP);
  on('oCls', 'oninput', e => { P.clsOpacity = +e.target.value; clsLayer.setOpacity(P.clsOpacity); }); on('oCls', 'onchange', saveP);
}

// ===================== ファイルの受け付け =====================
document.getElementById('inDem').onchange = async e => { const f = [...e.target.files]; e.target.value = ''; await addDemFiles(f); };
document.getElementById('inFude').onchange = async e => { const f = [...e.target.files]; e.target.value = ''; await addFudeFiles(f); };
const mapEl = document.getElementById('map');
mapEl.addEventListener('dragover', e => { e.preventDefault(); mapEl.classList.add('drop'); });
mapEl.addEventListener('dragleave', () => mapEl.classList.remove('drop'));
mapEl.addEventListener('drop', async e => {
  e.preventDefault(); mapEl.classList.remove('drop');
  const fs = [...e.dataTransfer.files];
  const dem = fs.filter(f => /\.tiff?$/i.test(f.name)), fude = fs.filter(f => /\.(geojson|json|gpkg)$/i.test(f.name));
  if (dem.length) await addDemFiles(dem);
  if (fude.length) await addFudeFiles(fude);
});
render();
</script>
</body>
